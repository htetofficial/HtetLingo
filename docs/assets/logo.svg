<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.25" flood-color="#0F172A" />
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Main Speech Bubble 1 (Left / Back) -->
  <path d="M140 180 C140 135.8 175.8 100 220 100 L300 100 C344.2 100 380 135.8 380 180 L380 230 C380 274.2 344.2 310 300 310 L220 310 L160 360 L170 310 C151.7 300 140 280 140 256 Z" 
        fill="rgba(255, 255, 255, 0.2)" 
        stroke="rgba(255,255,255,0.4)" 
        stroke-width="3"
        filter="url(#shadow)" />

  <!-- Main Speech Bubble 2 (Front Accent) -->
  <path d="M170 210 C170 171.3 201.3 140 240 140 L330 140 C368.7 140 400 171.3 400 210 L400 260 C400 298.7 368.7 330 330 330 L270 330 L200 380 L212 330 C187 320 170 296 170 268 Z" 
        fill="#FFFFFF" 
        filter="url(#shadow)" />

  <!-- Global Culture Nodes (Language glyphs styling) -->
  <!-- 'H' and 'L' stylized inside bubble -->
  <text x="240" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="78" font-weight="900" fill="#4F46E5" text-anchor="middle">H</text>
  <text x="315" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="#EC4899" text-anchor="middle">L</text>
  
  <!-- Mini Language accents -->
  <!-- Asian glyph accent dot / soundwaves -->
  <circle cx="350" cy="190" r="14" fill="url(#accentGrad)" />
  <circle cx="365" cy="180" r="6" fill="#F43F5E" />
  
  <!-- Sound / Translation Waves -->
  <path d="M365 220 Q378 230 365 240" fill="none" stroke="#6366F1" stroke-width="4" stroke-linecap="round" />
  <path d="M375 212 Q395 230 375 248" fill="none" stroke="#6366F1" stroke-width="4" stroke-linecap="round" />

  <!-- Burmese cultural touch accent -->
  <path d="M190 285 Q205 275 215 288" fill="none" stroke="#8B5CF6" stroke-width="3.5" stroke-linecap="round" />
</svg>
