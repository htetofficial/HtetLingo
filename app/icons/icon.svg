<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Cute Rose & Lavender Feminist Gradient -->
    <linearGradient id="roseLilacGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="40%" stop-color="#F43F5E" />
      <stop offset="75%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Sakura Pastel Shimmer -->
    <linearGradient id="sakuraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="100%" stop-color="#FCE7F3" />
    </linearGradient>

    <!-- Golden Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <filter id="cuteShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity="0.25" flood-color="#831843" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="512" height="512" rx="140" fill="url(#roseLilacGrad)" />

  <!-- Background Cute Subtle Circles -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-dasharray="6 8" />

  <!-- Cute Chat Bubble with Heart Shape Accent -->
  <g filter="url(#cuteShadow)">
    <!-- Back Speech Bubble (Lavender Tint) -->
    <path d="M150 170 C150 125 186 90 230 90 L310 90 C354 90 390 125 390 170 L390 230 C390 274 354 310 310 310 L220 310 L160 365 L175 310 C158 298 150 276 150 250 Z" 
          fill="rgba(255, 255, 255, 0.28)" 
          stroke="rgba(255,255,255,0.5)" 
          stroke-width="3" />

    <!-- Main Front Cute Speech Bubble -->
    <path d="M180 200 C180 158 214 125 255 125 L340 125 C381 125 415 158 415 200 L415 260 C415 301 381 335 340 335 L270 335 L205 385 L218 335 C195 324 180 300 180 270 Z" 
          fill="#FFFFFF" />
  </g>

  <!-- Feminist Venus / Empowerment Sign in Speech Bubble -->
  <!-- Cute stylized Venus circle with heart center -->
  <circle cx="265" cy="225" r="46" fill="none" stroke="#F43F5E" stroke-width="12" stroke-linecap="round" />
  <!-- Venus cross -->
  <line x1="265" y1="271" x2="265" y2="305" stroke="#F43F5E" stroke-width="12" stroke-linecap="round" />
  <line x1="248" y1="288" x2="282" y2="288" stroke="#F43F5E" stroke-width="12" stroke-linecap="round" />

  <!-- Cute Heart inside the Venus symbol -->
  <path d="M265 235 C265 235 250 220 250 210 C250 202 256 196 264 196 C268 196 272 199 274 203 C276 199 280 196 284 196 C292 196 298 202 298 210 C298 220 283 235 283 235 L274 243 Z"
        fill="#FB7185" />

  <!-- Stylized "HL" Monogram Accent (HtetLingo) -->
  <text x="350" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#A855F7" text-anchor="middle">HL</text>

  <!-- Cute Sparkles & Stars (✨) -->
  <!-- Sparkle 1 (Top Right) -->
  <path d="M380 90 Q395 105 410 105 Q395 105 380 120 Q365 105 350 105 Q365 105 380 90 Z" fill="url(#sparkleGrad)" />
  <circle cx="410" cy="85" r="6" fill="#FDE047" />

  <!-- Sparkle 2 (Bottom Left) -->
  <path d="M125 310 Q138 322 150 322 Q138 322 125 335 Q112 322 100 322 Q112 322 125 310 Z" fill="url(#sparkleGrad)" />

  <!-- Cute Sakura Blossom (🌸) Accent on Top-Left -->
  <g transform="translate(130, 115) scale(0.65)">
    <circle cx="25" cy="0" r="18" fill="#FDA4AF" />
    <circle cx="50" cy="25" r="18" fill="#FDA4AF" />
    <circle cx="40" cy="55" r="18" fill="#FDA4AF" />
    <circle cx="10" cy="55" r="18" fill="#FDA4AF" />
    <circle cx="0" cy="25" r="18" fill="#FDA4AF" />
    <circle cx="25" cy="32" r="12" fill="#FDE047" />
  </g>
</svg>
