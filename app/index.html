<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HtetLingo — Learn Languages. Empower Your Voice. Connect Cultures.</title>
  <meta name="description" content="A cute, feminist multilingual learning, dictionary, and AI tutoring platform for English, Burmese, Japanese, Chinese, Thai, French, German, and Korean.">
  
  <!-- Modern Web Guidance Theme Setup & FOUC Prevention -->
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      const stored = localStorage.getItem("color-scheme");
      if (stored) {
        document.querySelector('meta[name="color-scheme"]').content = stored;
      }
    } catch (e) {}
  </script>

  <!-- PWA Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F43F5E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/duolingo.css">
</head>
<body>
  <div class="app-container">
    <!-- Offline status notification banner -->
    <div id="offlineBanner" class="offline-banner" style="display: none;"></div>

    <!-- Gamified Top Bar (Duolingo Style) -->
    <header class="game-top-bar">
      <button id="langSelectorBtn" class="lang-selector-btn" title="Switch Target Language" onclick="app.openLanguageModal()">
        <span id="topLangLabel">🇯🇵 Japanese</span>
      </button>

      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <div id="topStreakPill" class="stat-pill stat-streak" title="Daily Streak">
          🔥 <span id="topStreakCount">5</span>
        </div>

        <div id="topGemsPill" class="stat-pill stat-gems" title="Empowerment Gems">
          💎 <span id="topGemsCount">120</span>
        </div>

        <div id="topHeartsPill" class="stat-pill stat-hearts" title="Hearts / Lives" onclick="app.switchTab('shop')" style="cursor: pointer;">
          ❤️ <span id="topHeartsCount">5</span>
        </div>

        <button id="themeToggleBtn" class="icon-btn" title="Toggle Light/Dark Theme" aria-label="Toggle theme">
          🌓
        </button>
      </div>
    </header>

    <!-- Main Dynamic Viewport -->
    <main class="main-viewport" id="mainViewport">
      <!-- Injected by app.js -->
    </main>

    <!-- Bottom Tab Navigation -->
    <nav class="bottom-nav" aria-label="Main Navigation">
      <button class="nav-tab-item active" data-tab="learn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>Learn</span>
      </button>

      <button class="nav-tab-item" data-tab="practice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"></circle><polygon points="12 6 12 12 16 14"></polygon></svg>
        <span>Practice</span>
      </button>

      <button class="nav-tab-item" data-tab="dict">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <span>Dict</span>
      </button>

      <button class="nav-tab-item" data-tab="aitutor">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="11" width="18" height="10" rx="2"></rect><circle cx="12" cy="5" r="2"></circle><path d="M12 7v4"></path><line x1="8" y1="16" x2="8.01" y2="16"></line><line x1="16" y1="16" x2="16.01" y2="16"></line></svg>
        <span>AI Tutor</span>
      </button>

      <button class="nav-tab-item" data-tab="shop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        <span>Shop VIP</span>
      </button>

      <button class="nav-tab-item" data-tab="profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <!-- Application Scripts -->
  <script src="js/sound.js"></script>
  <script src="js/curriculum.js"></script>
  <script src="js/data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/revenueCat.js"></script>
  <script src="js/aiTutor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
