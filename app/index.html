<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HtetLingo — Multilingual Learning, Dictionary & AI Tutoring</title>
  <meta name="description" content="Learn English, Japanese, Chinese, Burmese, Thai, French, German, and Korean with spaced repetition, native audio, grammar guides, and AI tutoring.">
  
  <!-- Modern Web Guidance Theme Setup & FOUC Prevention -->
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      const stored = localStorage.getItem("color-scheme");
      if (stored) {
        document.querySelector('meta[name="color-scheme"]').content = stored;
      }
    } catch (e) {}
  </script>

  <!-- PWA Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366F1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-container">
    <!-- Offline status notification banner -->
    <div id="offlineBanner" class="offline-banner" style="display: none;"></div>

    <!-- Header Navigation Bar -->
    <header class="app-header">
      <div class="brand-wrapper" onclick="app.switchTab('home')">
        <img src="icons/icon.svg" alt="HtetLingo Logo" class="brand-logo">
        <span class="brand-title">HtetLingo</span>
      </div>

      <div class="header-actions">
        <button id="langSelectorBtn" class="lang-selector-btn" title="Choose Target Language">
          <span>🇯🇵 Japanese</span>
        </button>

        <div id="headerStreak" class="pill-btn streak-pill" title="Daily Learning Streak">
          🔥 3d
        </div>

        <button id="themeToggleBtn" class="icon-btn" title="Toggle Light/Dark Theme" aria-label="Toggle theme">
          🌓
        </button>
      </div>
    </header>

    <!-- Main Dynamic Viewport -->
    <main class="main-viewport" id="mainViewport">
      <!-- Injected by app.js -->
    </main>

    <!-- Bottom Tab Navigation -->
    <nav class="bottom-nav" aria-label="Main Navigation">
      <button class="nav-tab-item active" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>Home</span>
      </button>

      <button class="nav-tab-item" data-tab="vocab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        <span>Vocab</span>
      </button>

      <button class="nav-tab-item" data-tab="grammar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
        <span>Grammar</span>
      </button>

      <button class="nav-tab-item" data-tab="quiz">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"></circle><polygon points="12 6 12 12 16 14"></polygon></svg>
        <span>Quiz</span>
      </button>

      <button class="nav-tab-item" data-tab="dict">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <span>Dict</span>
      </button>

      <button class="nav-tab-item" data-tab="translate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <span>Translate</span>
      </button>

      <button class="nav-tab-item" data-tab="aitutor">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="11" width="18" height="10" rx="2"></rect><circle cx="12" cy="5" r="2"></circle><path d="M12 7v4"></path><line x1="8" y1="16" x2="8.01" y2="16"></line><line x1="16" y1="16" x2="16.01" y2="16"></line></svg>
        <span>AI Tutor</span>
      </button>

      <button class="nav-tab-item" data-tab="pricing">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        <span>Premium</span>
      </button>

      <button class="nav-tab-item" data-tab="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <!-- Application Scripts -->
  <script src="js/data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/revenueCat.js"></script>
  <script src="js/aiTutor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
